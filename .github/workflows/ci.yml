name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy,llvm-tools-preview --target aarch64-linux-android
          rustup default stable

      - name: Format
        run: cargo fmt --all --check

      # Fails on any feature-to-feature, upward (data → UI) or layer-skipping dependency,
      # on any third-party crate missing from DEPENDENCIES.md, on OS access outside a platform
      # adapter, and on fakes turned on outside tests. See ARCHITECTURE.md. Also fails on a
      # bundled asset missing from ASSETS.md, a licence text About doesn't show, a third-party
      # name in the app's text or store listing, and a listing without the privacy notice or
      # the non-affiliation statement (ADR 0037).
      - name: Architecture rules
        run: cargo test -p arch-check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # Line coverage of the data and state crates (MAINT-02). Fails below 80 %; the table is
      # shown on the run's summary page. The alias is in .cargo/config.toml.
      - name: Core-logic coverage
        shell: bash
        run: |
          {
            echo '### Core-logic line coverage (MAINT-02)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          cargo coverage | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Lints the Android-only code (the JNI binding and entry points) too, which the host
      # build never compiles (ADR 0005).
      - name: Android target
        run: cargo clippy --workspace --exclude arch-check --all-targets --target aarch64-linux-android -- -D warnings

  # Builds the APK: the Java host plus the Rust app as a native library (ADR 0005). The runner
  # image already has JDK 17, the Android SDK and NDK 27.3.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-linux-android
          rustup default stable

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease
