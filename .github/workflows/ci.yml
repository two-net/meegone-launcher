name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy,llvm-tools-preview --target aarch64-linux-android
          rustup default stable

      - name: Format
        run: cargo fmt --all --check

      # Fails on any feature-to-feature, upward (data → UI) or layer-skipping dependency,
      # on any third-party crate missing from DEPENDENCIES.md, on OS access outside a platform
      # adapter, and on fakes turned on outside tests. See ARCHITECTURE.md.
      - name: Architecture rules
        run: cargo test -p arch-check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # Line coverage of the data and state crates (MAINT-02). Fails below 80 %; the table is
      # shown on the run's summary page. The alias is in .cargo/config.toml.
      - name: Core-logic coverage
        shell: bash
        run: |
          {
            echo '### Core-logic line coverage (MAINT-02)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          cargo coverage | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Android target
        run: cargo check --workspace --exclude arch-check --target aarch64-linux-android
