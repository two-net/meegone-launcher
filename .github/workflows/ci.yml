name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy,llvm-tools-preview --target aarch64-linux-android
          rustup default stable

      - name: Format
        run: cargo fmt --all --check

      # Fails on any feature-to-feature, upward (data → UI) or layer-skipping dependency,
      # on any third-party crate missing from DEPENDENCIES.md, on OS access outside a platform
      # adapter, and on fakes turned on outside tests. See ARCHITECTURE.md. Also fails on a
      # bundled asset missing from ASSETS.md, a licence text About doesn't show, a third-party
      # name in the app's text or store listing, and a listing without the privacy notice or
      # the non-affiliation statement (ADR 0037). And fails on a colour the Java host draws that
      # isn't one of the theme's tokens, or a text size that isn't in sp (ADR 0038). And fails on
      # text for the user written in Java or Rust code rather than a string resource, a number
      # shown in ASCII digits whatever the language, a Problem without its words, and a string
      # resource without a comment for translators or with unnumbered arguments (ADR 0040).
      # And fails on a permission SRS 8.1 doesn't list, a component other apps can reach beyond
      # the home entry, the settings entry and the notification listener, a network config that
      # allows cleartext or certificates other than the system's, an API MeeGone rules out (web
      # views, links in text, the lock screen, device identifiers), a connection outside the
      # bridge, and a log that carries an exception (ADR 0042). And fails on Java that sets an
      # uncaught-exception handler, kills a process or exits outside Restart MeeGone, a Gradle
      # build that adds a library or another plugin, and bugs made to order turned on outside
      # the debug build (ADR 0043). And fails on an oldest Android that differs between SRS.md,
      # minSdk and the Rust library's build, a Gradle build that lets lint's NewApi through, and
      # shipped Java that hides a call from it without a reason (ADR 0044).
      - name: Architecture rules
        run: cargo test -p arch-check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # The Rust app's share of each performance budget, timed with fakes and 300 apps: fails if
      # a median goes past a tenth of its device budget, which only a much slower algorithm
      # would. The table is shown on the run's summary page. The budgets themselves are
      # measured on a device with tools/perf-bench.sh (ADR 0041).
      - name: Performance budgets (host)
        shell: bash
        run: |
          {
            echo "### The Rust app's share of the performance budgets (ADR 0041)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          # GitHub runs bash with pipefail, so a budget past its limit fails the step.
          cargo bench --bench budgets | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # Line coverage of the data and state crates (MAINT-02). Fails below 80 %; the table is
      # shown on the run's summary page. The alias is in .cargo/config.toml.
      - name: Core-logic coverage
        shell: bash
        run: |
          {
            echo '### Core-logic line coverage (MAINT-02)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          cargo coverage | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Lints the Android-only code (the JNI binding and entry points) too, which the host
      # build never compiles (ADR 0005).
      - name: Android target
        run: cargo clippy --workspace --exclude arch-check --all-targets --target aarch64-linux-android -- -D warnings

  # Builds the APK: the Java host plus the Rust app as a native library (ADR 0005). The runner
  # image already has JDK 17, the Android SDK and NDK 27.3.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-linux-android
          rustup default stable

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2

      # The debug, release and benchmark builds; the benchmark build is what tools/perf-bench.sh
      # measures (ADR 0041).
      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease assembleBenchmark

      # SEC-03, SEC-04, SEC-06: the release APK, as built, asks for exactly SRS 8.1's
      # permissions, lets other apps reach only the home entry, the settings entry and the
      # notification listener, isn't debuggable, and holds none of the debug build's own
      # classes. The runner's aapt2 and dexdump read it (ADR 0042). REL-07: it holds only
      # MeeGone's own classes, so no crash-reporting SDK, and its native library has no fault
      # hook (ADR 0043).
      - name: Release build's access
        run: cargo test -p arch-check --test release_apk -- --ignored

      # PERF-08: the release APK, which is what installs, stays within 15 MB.
      - name: Install size
        shell: bash
        run: |
          apk=android/app/build/outputs/apk/release/app-release-unsigned.apk
          bytes=$(stat -c %s "$apk")
          echo "The release APK is $bytes bytes." | tee -a "$GITHUB_STEP_SUMMARY"
          if ((bytes > 15 * 1024 * 1024)); then
            echo "It is over PERF-08's 15 MB." >&2
            exit 1
          fi
