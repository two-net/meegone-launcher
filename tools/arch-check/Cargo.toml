[package]
name = "arch-check"
description = "Checks the workspace dependency graph against the rules in ARCHITECTURE.md, the app's assets, text and store listing against the legal rules of ADR 0037, its colours and text sizes against the accessibility rules of ADR 0038, its text against the localisation rules of ADR 0040, its manifest, network config, Java and release APK against the security and privacy rules of ADR 0042, its Java, Gradle build and release APK against the reliability rules of ADR 0043, and its Android version floor, lint settings and Java against the compatibility rules of ADR 0044. A development tool, never part of the app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde_json = "1.0.154"
