[package]
name = "arch-check"
description = "Checks the workspace dependency graph against the rules in ARCHITECTURE.md, the app's assets, text and store listing against the legal rules of ADR 0037, its colours and text sizes against the accessibility rules of ADR 0038, and its text against the localisation rules of ADR 0040. A development tool, never part of the app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde_json = "1.0.154"
